[package]
name = "horizon_xbox"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel_Core",
    "UI_Core",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
